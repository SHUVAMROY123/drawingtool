<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawing App</title>
  <link rel="stylesheet" href="project.css">
</head>
<body>

  <div class="app">

    <header>
      <h1>🎨 Drawing App</h1>
      <p>Draw, create shapes, and save your artwork!</p>
    </header>

    <div class="toolbar">

      <div class="tool">
        <label>Color</label>
        <input type="color" id="color" value="#000000">
      </div>

      <div class="tool">
        <label>Size</label>
        <input type="range" id="brushSize" min="1" max="50" value="5">
        <span id="sizeValue">5</span>
      </div>

      <div class="tools">
        <button id="brushBtn" class="active">🖌️ Brush</button>
        <button id="lineBtn">📏 Line</button>
        <button id="rectBtn">⬜ Rectangle</button>
        <button id="circleBtn">⭕ Circle</button>
        <button id="eraserBtn">🧹 Eraser</button>
      </div>

      <div class="actions">
        <button id="clearBtn">🗑️ Clear</button>
        <button id="saveBtn">💾 Save</button>
      </div>

    </div>

    <div class="canvas-container">
      <canvas id="canvas"></canvas>
    </div>

  </div>

  <script src="project.js"></script>
</body>
</html>
